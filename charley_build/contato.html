<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contato | Barbearia do Charley</title>
<meta name="description" content="Endereço, mapa, WhatsApp e Instagram da Barbearia do Charley em Afogados, Recife.">
<meta name="theme-color" content="#0b0b0b">
<meta property="og:type" content="website"><meta property="og:locale" content="pt_BR">
<meta property="og:title" content="Contato | Barbearia do Charley"><meta property="og:description" content="Endereço, mapa, WhatsApp e Instagram da Barbearia do Charley em Afogados, Recife.">
<meta property="og:image" content="https://barbeariadocharley.netlify.app/icons/og.jpg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">

</head>
<body>
<a class="sr" href="#main">Ir para o conteúdo</a>
<header id="app-header"></header>
<main id="main">

<section class="block"><div class="wrap">
  <h1>Contato</h1>
  <div class="grid">
    <div class="card"><h3>Endereço</h3><p id="addr"></p><p><a class="btn small" id="route" target="_blank" rel="noopener" href="#">Como chegar</a></p></div>
    <div class="card"><h3>Fale com a gente</h3><p><a class="btn small" id="wa" target="_blank" rel="noopener" href="#">WhatsApp</a> <a class="btn small ghost" id="ig" target="_blank" rel="noopener" href="#">Instagram</a></p></div>
  </div>
  <h2 style="margin-top:32px">Mande uma mensagem</h2>
  <form id="form" class="card" style="max-width:560px" novalidate>
    <label for="name">Seu nome</label><input id="name" autocomplete="name" required>
    <label for="phone">Seu WhatsApp (opcional)</label><input id="phone" inputmode="tel" autocomplete="tel">
    <label for="msg">Mensagem</label><textarea id="msg" required></textarea>
    <p class="hint">Ao enviar, abrimos o seu WhatsApp com a mensagem pronta. Nada fica guardado no site.</p>
    <button class="btn" type="submit">Enviar pelo WhatsApp</button>
  </form>
  <p style="margin-top:24px"><iframe class="map" id="map" title="Mapa da Barbearia do Charley" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></p>
</div></section>
</main>
<footer id="app-footer"></footer>
<script type="module" src="js/contato.js"></script>
</body>
</html>
